name: attendance_payroll
description: Offline-first employee attendance and payroll application.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  # Typed SQLite access and schema migrations.
  drift: ^2.35.2
  # Opens the on-device database on a background isolate (bundles SQLite).
  drift_flutter: ^0.3.1
  # Picks a backup file to import (the system file picker).
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  # State management and dependency injection (Notifier API, no code generation).
  flutter_riverpod: ^3.4.3
  # Keeps the backup password in the platform's secure storage (Android Keystore).
  flutter_secure_storage: ^11.2.0
  # Declarative routing, including the stateful admin shell.
  go_router: ^18.0.2
  # The app's private folder, where backups are kept.
  path_provider: ^2.1.6
  # PDF documents (payslips, payroll summary, attendance reports).
  pdf: ^3.13.1
  # PBKDF2-HMAC-SHA256 for hashing PINs and passwords, and AES-GCM for
  # encrypting backups (Bouncy Castle port).
  pointycastle: ^4.0.0
  # Bluetooth (classic) connection to thermal receipt printers.
  print_bluetooth_thermal: ^1.2.5
  # PDF preview, printing and sharing through the platform.
  printing: ^5.15.1
  # Shares a backup file through the system share sheet (Drive, email, ...).
  share_plus: ^13.3.1
  # SqliteException and its error codes, to map constraint violations; opens
  # backup snapshots to check them.
  sqlite3: ^3.5.2
  # IANA timezone database: attendance follows the company's timezone.
  timezone: ^0.11.1
  # UUIDv7 identifiers that devices can generate independently.
  uuid: ^4.6.0

dev_dependencies:
  # Runs drift_dev code generation.
  build_runner: ^2.16.2
  # Drift code generator, schema snapshots and migration test helpers.
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # Embedded in PDFs so documents render the same on every device, offline.
    # Roboto, Apache License 2.0 (see LICENSE-Roboto.txt).
    - assets/fonts/
