name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      # Includes the migration, performance, accessibility and end-to-end
      # tests (see docs/RELEASE.md).
      - run: flutter test

  android:
    # The release build must keep working, and keep the promises the app makes
    # about itself: it never uses the network and never lets Android copy the
    # database to a Google account.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the release APK
        # Without android/key.properties this is signed with the debug key:
        # fine for checking the build, never to be distributed.
        run: flutter build apk --release
      - name: The release APK has no network permission
        run: |
          aapt="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)"
          permissions="$("$aapt" dump permissions build/app/outputs/flutter-apk/app-release.apk)"
          echo "$permissions"
          if echo "$permissions" | grep -q "android.permission.INTERNET"; then
            echo "The release APK must not request INTERNET." >&2
            exit 1
          fi
      - name: Android Auto Backup is off
        run: |
          aapt="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)"
          badging="$("$aapt" dump xmltree build/app/outputs/flutter-apk/app-release.apk AndroidManifest.xml)"
          echo "$badging" | grep -q 'allowBackup.*=(type 0x12)0x0' || {
            echo "android:allowBackup must be false." >&2
            exit 1
          }
